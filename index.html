<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flappy Bird</title>
<style>
  :root {
    --sky-top: #6ec6ff;
    --sky-bottom: #bfe9ff;
    --pipe: #4caf50;
    --pipe-dark: #388e3c;
    --ground: #ded895;
    --bird: #ffcc33;
    --text: #2b2b2b;
    --panel-bg: rgba(255,255,255,0.95);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(#1a1a2e, #0f0f1a);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    width: 400px;
    max-width: 100vw;
    height: 600px;
    max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    border-radius: 8px;
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    text-align: center;
    background: rgba(0,0,0,0.35);
    color: white;
  }
  .hidden { display: none !important; }
  .panel {
    background: var(--panel-bg);
    color: var(--text);
    border-radius: 14px;
    padding: 24px 28px;
    width: 100%;
    max-width: 300px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    color: #ff8f00;
    text-shadow: 2px 2px 0 #b45309;
  }
  h2 { margin: 0 0 10px; font-size: 20px; }
  p.sub { margin: 0 0 16px; font-size: 14px; opacity: 0.8; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #ccc;
    margin-bottom: 12px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #ff8f00; }
  button {
    background: #ff8f00;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: #fb8c00; }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: #eee;
    color: #333;
    margin-top: 8px;
  }
  button.secondary:hover { background: #ddd; }
  ol#leaderboard, ol#leaderboard-final {
    list-style: none;
    padding: 0;
    margin: 0 0 14px;
    text-align: left;
    max-height: 180px;
    overflow-y: auto;
  }
  ol#leaderboard li, ol#leaderboard-final li {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  ol#leaderboard li:nth-child(odd), ol#leaderboard-final li:nth-child(odd) {
    background: rgba(0,0,0,0.05);
  }
  ol#leaderboard li.me, ol#leaderboard-final li.me {
    background: #fff3cd;
    font-weight: bold;
  }
  .rank { opacity: 0.6; margin-right: 8px; }
  #score-display {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    pointer-events: none;
    z-index: 5;
  }
  .hint {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="score-display" class="hidden">0</div>
  <canvas id="game" width="400" height="600"></canvas>

  <!-- Start / Name entry -->
  <div id="start-screen" class="overlay">
    <div class="panel">
      <h1>🐦 Flappy Bird</h1>
      <p class="sub">Gib deinen Namen ein und tippe / klicke, um zu fliegen!</p>
      <input type="text" id="name-input" placeholder="Dein Name" maxlength="16" autocomplete="off">
      <button id="start-btn">Spiel starten</button>
      <ol id="leaderboard"></ol>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="panel">
      <h2>Game Over</h2>
      <p class="sub" id="final-score-text">Score: 0</p>
      <ol id="leaderboard-final"></ol>
      <button id="retry-btn">Nochmal spielen</button>
      <button id="change-name-btn" class="secondary">Namen ändern</button>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const nameInput = document.getElementById('name-input');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const changeNameBtn = document.getElementById('change-name-btn');
  const scoreDisplay = document.getElementById('score-display');
  const finalScoreText = document.getElementById('final-score-text');
  const leaderboardEl = document.getElementById('leaderboard');
  const leaderboardFinalEl = document.getElementById('leaderboard-final');

  const STORAGE_KEY = 'flappyBirdLeaderboardV1';
  const NAME_KEY = 'flappyBirdPlayerName';
  const GROUND_HEIGHT = 80;

  let playerName = localStorage.getItem(NAME_KEY) || '';
  nameInput.value = playerName;

  let state = 'idle'; // idle | playing | gameover
  let bird, pipes, score, frame, groundOffset;

  const GRAVITY = 0.45;
  const JUMP_VELOCITY = -8;
  const PIPE_WIDTH = 60;
  const PIPE_GAP = 150;
  const PIPE_SPEED = 2.6;
  const PIPE_SPACING = 220;

  function resetGame() {
    bird = { x: 90, y: H / 2, vy: 0, r: 14, rotation: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    groundOffset = 0;
    spawnPipe(W + 100);
    spawnPipe(W + 100 + PIPE_SPACING);
  }

  function spawnPipe(x) {
    const margin = 60;
    const gapY = margin + Math.random() * (H - GROUND_HEIGHT - PIPE_GAP - margin * 2);
    pipes.push({ x: x, gapY: gapY, passed: false });
  }

  function getLeaderboard() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveScore(name, sc) {
    const list = getLeaderboard();
    list.push({ name: name, score: sc, ts: Date.now() });
    list.sort((a, b) => b.score - a.score);
    const trimmed = list.slice(0, 10);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
    return trimmed;
  }

  function renderLeaderboard(el, highlightScore, highlightName) {
    const list = getLeaderboard();
    el.innerHTML = '';
    if (list.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'Noch keine Einträge – sei der Erste!';
      li.style.opacity = '0.6';
      el.appendChild(li);
      return;
    }
    list.forEach((entry, i) => {
      const li = document.createElement('li');
      const isMe = highlightName !== undefined &&
                   entry.name === highlightName &&
                   entry.score === highlightScore;
      if (isMe) li.classList.add('me');
      li.innerHTML =
        '<span><span class="rank">#' + (i + 1) + '</span>' +
        escapeHtml(entry.name) + '</span><span>' + entry.score + '</span>';
      el.appendChild(li);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function flap() {
    if (state === 'playing') {
      bird.vy = JUMP_VELOCITY;
    }
  }

  function startGame() {
    let name = nameInput.value.trim();
    if (!name) name = 'Spieler';
    name = name.slice(0, 16);
    playerName = name;
    localStorage.setItem(NAME_KEY, name);

    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    scoreDisplay.classList.remove('hidden');
    scoreDisplay.textContent = '0';
  }

  function endGame() {
    state = 'gameover';
    scoreDisplay.classList.add('hidden');
    const updated = saveScore(playerName, score);
    finalScoreText.textContent = 'Score: ' + score;
    renderLeaderboard(leaderboardFinalEl, score, playerName);
    gameoverScreen.classList.remove('hidden');
  }

  function update() {
    if (state !== 'playing') return;
    frame++;

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

    groundOffset = (groundOffset + PIPE_SPEED) % 24;

    for (const pipe of pipes) {
      pipe.x -= PIPE_SPEED;
      if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
        pipe.passed = true;
        score++;
        scoreDisplay.textContent = score;
      }
    }

    if (pipes.length && pipes[0].x < -PIPE_WIDTH) {
      pipes.shift();
      const lastX = pipes[pipes.length - 1].x;
      spawnPipe(lastX + PIPE_SPACING);
    }

    // Collisions
    if (bird.y + bird.r > H - GROUND_HEIGHT || bird.y - bird.r < 0) {
      endGame();
      return;
    }
    for (const pipe of pipes) {
      const withinX = bird.x + bird.r > pipe.x && bird.x - bird.r < pipe.x + PIPE_WIDTH;
      if (withinX) {
        const gapTop = pipe.gapY;
        const gapBottom = pipe.gapY + PIPE_GAP;
        if (bird.y - bird.r < gapTop || bird.y + bird.r > gapBottom) {
          endGame();
          return;
        }
      }
    }
  }

  function drawBackground() {
    // clouds (simple)
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 3; i++) {
      const cx = ((frame * 0.3) + i * 180) % (W + 120) - 60;
      const cy = 60 + i * 70;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 30, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 20, cy + 6, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPipes() {
    for (const pipe of pipes) {
      const gapTop = pipe.gapY;
      const gapBottom = pipe.gapY + PIPE_GAP;

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--pipe');
      ctx.fillRect(pipe.x, 0, PIPE_WIDTH, gapTop);
      ctx.fillRect(pipe.x, gapBottom, PIPE_WIDTH, H - GROUND_HEIGHT - gapBottom);

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--pipe-dark');
      ctx.fillRect(pipe.x - 4, gapTop - 20, PIPE_WIDTH + 8, 20);
      ctx.fillRect(pipe.x - 4, gapBottom, PIPE_WIDTH + 8, 20);
    }
  }

  function drawGround() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground');
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let x = -groundOffset; x < W; x += 24) {
      ctx.fillRect(x, H - GROUND_HEIGHT, 12, 8);
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bird');
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    // wing
    ctx.fillStyle = '#e6a500';
    ctx.beginPath();
    ctx.ellipse(-4, 2, 7, 5, 0.3, 0, Math.PI * 2);
    ctx.fill();
    // eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(6, -4, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(7.5, -4, 2, 0, Math.PI * 2);
    ctx.fill();
    // beak
    ctx.fillStyle = '#ff7043';
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, -2);
    ctx.lineTo(bird.r + 8, 1);
    ctx.lineTo(bird.r - 2, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawPipes();
    drawGround();
    if (state !== 'idle') drawBird();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Input handling
  function handleInput(e) {
    if (state === 'playing') {
      e.preventDefault();
      flap();
    }
  }
  canvas.addEventListener('mousedown', handleInput);
  canvas.addEventListener('touchstart', handleInput, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'playing') flap();
      else if (state === 'idle' || document.activeElement !== nameInput) {
        if (!startScreen.classList.contains('hidden')) startGame();
      }
    }
  });

  startBtn.addEventListener('click', startGame);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startGame();
  });
  retryBtn.addEventListener('click', () => {
    gameoverScreen.classList.add('hidden');
    startGame();
  });
  changeNameBtn.addEventListener('click', () => {
    gameoverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    renderLeaderboard(leaderboardEl);
  });

  // init
  renderLeaderboard(leaderboardEl);
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
